<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Julieta Rodríguez</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23b4382b'/%3E%3Ctext x='32' y='46' font-family='Didot,Georgia,serif' font-weight='700' font-size='38' text-anchor='middle' fill='%23fff'%3EJ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,900;1,6..96,400&family=Manrope:wght@400;600&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#f6f1ea}
  body{color:#1d1714;font-family:"Manrope",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:360px;text-align:center;border-top:2px solid #1d1714;border-bottom:2px solid #1d1714;padding:34px 8px}
  .m{font-family:"Bodoni Moda",Georgia,serif;font-weight:900;font-size:3rem;line-height:.9;letter-spacing:-.03em}
  h1{font-family:"Bodoni Moda",Georgia,serif;font-style:italic;font-weight:400;font-size:1.4rem;margin-top:14px}
  p{margin-top:8px;font-size:.86rem;line-height:1.5;color:#6f645c}
  .guide{display:none;margin-top:22px;border-top:1px solid rgba(29,23,20,.18);padding-top:20px}
  .guide.on{display:block}
  .guide b{display:block;font-weight:600;font-size:.9rem}
  .btn{display:block;margin-top:16px;padding:15px 16px;background:#1d1714;color:#f6f1ea;text-decoration:none;font-size:.7rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
  .fb{display:inline-block;margin-top:18px;font-size:.75rem;color:#6f645c}
</style>
</head>
<body>
<div class="card" role="status" aria-live="polite">
  <div class="m">JULIETA</div>
  <h1>Opening…</h1>
  <p>One moment, taking you there.</p>
  <div class="guide" id="guide">
    <b>Open in your browser</b>
    <p>Tap ⋯ at the top right and choose “Open in browser”.</p>
    <a class="btn" id="cta" href="/" target="_blank" rel="noopener noreferrer nofollow">Open now</a>
  </div>
  <a class="fb" id="fb" href="/" rel="noopener noreferrer nofollow">Not loading? Tap here.</a>
</div>
<script>
(function(){
  // Same in-app escape as PicLink /go (GoRedirect.tsx), standalone.
  // ?to=<key> resolves a named destination so the home page HTML never contains it.
  // Mismo escape que /go de PicLink. ?to=<clave> resuelve un destino con nombre
  // para que el HTML de la portada nunca lo contenga.
  var NAMED={members:['https://','only','fans.com','/julirodriguezok/c125'].join('')};
  var ALLOW=/(^|\.)(instagram\.com|tiktok\.com|t\.me|telegram\.me|x\.com|twitter\.com|onlyfans\.com|fanvue\.com)$/i;
  var q=new URLSearchParams(location.search);
  var raw=NAMED[q.get('to')]||q.get('url')||'';
  var url='/';
  try{var u=new URL(raw);if((u.protocol==='https:'||u.protocol==='http:')&&ALLOW.test(u.hostname))url=u.href;}catch(e){}
  document.getElementById('fb').href=url;
  document.getElementById('cta').href=url;
  if(url==='/'){location.replace('/');return;}

  var ua=navigator.userAgent||'';
  var inApp=/Instagram|FBAN|FBAV|musical_ly|Bytedance|TikTok|Barcelona/i.test(ua);
  var android=/Android/i.test(ua);
  var failSafe;

  if(!inApp){setTimeout(function(){location.replace(url)},500);return;}

  if(android){
    try{
      location.href='intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(url)+';end';
    }catch(e){}
    failSafe=setTimeout(function(){if(!document.hidden)location.replace(url)},2600);
    document.addEventListener('visibilitychange',function(){if(document.hidden&&failSafe)clearTimeout(failSafe)});
    return;
  }

  function guided(){
    document.getElementById('guide').classList.add('on');
    try{window.open(url,'_blank')}catch(e){}
    failSafe=setTimeout(function(){location.replace(url)},7000);
  }
  var scheme=/Barcelona/i.test(ua)?'barcelona://extbrowser/?url=':/Instagram/i.test(ua)?'instagram://extbrowser/?url=':null;
  if(!scheme){guided();return;}

  function gone(){if(failSafe)clearTimeout(failSafe)}
  document.addEventListener('visibilitychange',function(){if(document.hidden)gone()});
  window.addEventListener('pagehide',gone);
  failSafe=setTimeout(function(){if(!document.hidden)location.replace(url)},7000);
  try{location.replace(scheme+encodeURIComponent(url))}catch(e){location.replace(url)}
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/"></noscript>
</body>
</html>
