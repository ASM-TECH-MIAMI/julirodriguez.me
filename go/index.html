<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Julieta Rodríguez</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23f0eae0'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='24' text-anchor='middle' fill='%23181410'%3EJR%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Italiana&family=Archivo:wght@400;500&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#f0eae0}
  body{color:#181410;font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:360px;text-align:center;border:1px solid rgba(24,20,16,.16);background:#f8f3ea;padding:36px 24px}
  .mono{width:52px;height:52px;margin:0 auto 18px;border:1px solid rgba(24,20,16,.32);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:"Italiana",serif;font-size:1.15rem;letter-spacing:.08em}
  h1{font-family:"Italiana",serif;font-weight:400;font-size:1.7rem;line-height:1.1}
  p{margin-top:10px;font-size:.86rem;line-height:1.5;color:#7c7160}
  .guide{display:none;margin-top:22px;border-top:1px solid rgba(24,20,16,.16);padding-top:20px}
  .guide.on{display:block}
  .guide b{display:block;font-weight:500;font-size:.9rem;color:#181410}
  .btn{display:block;margin-top:16px;padding:14px 16px;background:#181410;color:#f0eae0;text-decoration:none;font-size:.7rem;letter-spacing:.3em;text-transform:uppercase}
  .fb{display:inline-block;margin-top:18px;font-size:.75rem;color:#7c7160}
</style>
</head>
<body>
<div class="card" role="status" aria-live="polite">
  <div class="mono">JR</div>
  <h1>Opening…</h1>
  <p>One moment, taking you there.</p>
  <div class="guide" id="guide">
    <b>Open in your browser</b>
    <p>Tap ⋯ at the top right and choose “Open in browser”.</p>
    <a class="btn" id="cta" href="/" target="_blank" rel="noopener noreferrer nofollow">Open now</a>
  </div>
  <a class="fb" id="fb" href="/" rel="noopener noreferrer nofollow">Not loading? Tap here.</a>
</div>
<script>
(function(){
  // Same in-app escape as PicLink /go (GoRedirect.tsx), standalone: no remote
  // config, no PicLink calls. Android → intent:// Chrome; iOS Instagram/Threads →
  // extbrowser scheme; other in-app → guided overlay; normal browser → redirect.
  // Mismo escape que /go de PicLink, sin depender de PicLink.
  var ALLOW=/(^|\.)(instagram\.com|tiktok\.com|t\.me|telegram\.me|x\.com|twitter\.com|onlyfans\.com|fanvue\.com)$/i;
  var raw=new URLSearchParams(location.search).get('url')||'';
  var url='/';
  try{var u=new URL(raw);if((u.protocol==='https:'||u.protocol==='http:')&&ALLOW.test(u.hostname))url=u.href;}catch(e){}
  document.getElementById('fb').href=url;
  document.getElementById('cta').href=url;
  if(url==='/'){location.replace('/');return;}

  var ua=navigator.userAgent||'';
  var inApp=/Instagram|FBAN|FBAV|musical_ly|Bytedance|TikTok|Barcelona/i.test(ua);
  var android=/Android/i.test(ua);
  var failSafe;

  if(!inApp){setTimeout(function(){location.replace(url)},500);return;}

  if(android){
    try{
      location.href='intent://'+url.replace(/^https?:\/\//,'')+'#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(url)+';end';
    }catch(e){}
    failSafe=setTimeout(function(){if(!document.hidden)location.replace(url)},2600);
    document.addEventListener('visibilitychange',function(){if(document.hidden&&failSafe)clearTimeout(failSafe)});
    return;
  }

  function guided(){
    document.getElementById('guide').classList.add('on');
    try{window.open(url,'_blank')}catch(e){}
    failSafe=setTimeout(function(){location.replace(url)},7000);
  }
  var scheme=/Barcelona/i.test(ua)?'barcelona://extbrowser/?url=':/Instagram/i.test(ua)?'instagram://extbrowser/?url=':null;
  if(!scheme){guided();return;}

  function gone(){if(failSafe)clearTimeout(failSafe)}
  document.addEventListener('visibilitychange',function(){if(document.hidden)gone()});
  window.addEventListener('pagehide',gone);
  failSafe=setTimeout(function(){if(!document.hidden)location.replace(url)},7000);
  try{location.replace(scheme+encodeURIComponent(url))}catch(e){location.replace(url)}
})();
</script>
<noscript><meta http-equiv="refresh" content="0;url=/"></noscript>
</body>
</html>
